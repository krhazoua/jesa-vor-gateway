name: VoR Gateway quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm build
      - run: pnpm check:budget

  authenticated-browser:
    if: ${{ secrets.E2E_STORAGE_STATE != '' }}
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: printf '%s' "$E2E_STORAGE_STATE" > e2e-storage-state.json
        env:
          E2E_STORAGE_STATE: ${{ secrets.E2E_STORAGE_STATE }}
      - run: pnpm dev > /tmp/vor-gateway.log 2>&1 &
      - run: pnpm test:e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_STORAGE_STATE: e2e-storage-state.json
          E2E_REQUIRE_PENDING_APPROVAL: "true"
      - name: Upload Playwright evidence and downloaded reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-browser-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
      - if: always()
        run: rm -f e2e-storage-state.json
